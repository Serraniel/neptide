version: "2"
linters:
  enable: [bodyclose, errorlint, gosec, misspell, revive, unconvert]
  settings:
    errcheck:
      # CLI output to stdout/stderr: nothing sensible to do on failure.
      exclude-functions: [fmt.Fprint, fmt.Fprintf, fmt.Fprintln]
    gosec:
      excludes:
        # The CLI reads paths the operator passes on its own command line.
        # Paths that come from repository content are checked with filepath.IsLocal.
        - G304
        - G703
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]
formatters:
  enable: [gofmt]
