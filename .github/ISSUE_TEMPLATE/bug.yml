name: Bug report
description: Something does not work as documented
labels: ["type:bug", "triage"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include `neptide version` and the host OS." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, render: shell }
