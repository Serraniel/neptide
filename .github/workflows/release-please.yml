#
# Keeps a standing release PR up to date. Merging it is the on-demand release:
# it tags vX.Y.Z and calls release.yml. See docs/releases.md.
name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # Called, not triggered by the tag: tags pushed with GITHUB_TOKEN start no workflow.
  release:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    permissions:
      contents: write
      packages: write
      id-token: write

  # Release PRs are opened with GITHUB_TOKEN, which starts no workflow; a
  # dispatch does. The checks run on the PR's head commit and show on the PR.
  release-pr-checks:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Run the required checks on open release PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.sha }}
        run: |
          gh pr list --state open --label "autorelease: pending" --json headRefName -q '.[].headRefName' |
            while read -r branch; do
              gh workflow run ci.yml --ref "$branch"
              gh workflow run security.yml --ref "$branch"
            done
