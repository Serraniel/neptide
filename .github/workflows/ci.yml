# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -count=1 ./...
      - run: go build ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: CGO_ENABLED=0 go build -o /tmp/neptide ./cmd/neptide
      - name: Compose update and rollback
        run: test/integration/compose.sh /tmp/neptide
      - name: Data-safe rollback with volume snapshots
        run: test/integration/snapshot.sh /tmp/neptide
      - name: Containers sharing a network namespace follow their parent
        run: test/integration/netns.sh /tmp/neptide
      - name: Pre- and post-update hooks
        run: test/integration/hooks.sh /tmp/neptide
      - name: Scheduled restarts
        run: test/integration/restart.sh /tmp/neptide
      - name: Swarm update and rollback (docker:dind)
        run: test/integration/swarm.sh /tmp/neptide
      - name: Uptime Kuma client against a real Kuma 2
        run: test/integration/kuma.sh

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  conventional-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # release-please builds the changelog from squash-merged PR titles.
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|security|deps|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::PR title must follow Conventional Commits, e.g. 'feat(stacks): add rollback'"; exit 1; }
