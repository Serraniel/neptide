# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -count=1 ./...
      - run: go build ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: CGO_ENABLED=0 go build -o /tmp/neptide ./cmd/neptide
      - name: Compose update and rollback
        run: test/integration/compose.sh /tmp/neptide
      - name: Data-safe rollback with volume snapshots
        run: test/integration/snapshot.sh /tmp/neptide
      - name: Containers sharing a network namespace follow their parent
        run: test/integration/netns.sh /tmp/neptide
      - name: Pre- and post-update hooks
        run: test/integration/hooks.sh /tmp/neptide
      - name: Scheduled restarts
        run: test/integration/restart.sh /tmp/neptide
      - name: Swarm update and rollback (docker:dind)
        run: test/integration/swarm.sh /tmp/neptide
      - name: Uptime Kuma client against a real Kuma 2
        run: test/integration/kuma.sh

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The public packages (pkg/...) stay compatible within a minor version:
  # NepFleet imports them (docs/library.md). An incompatible change against
  # the last release needs "!" in the PR title, so the changelog says so.
  api-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compare pkg/ with the last release
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261117202309-7a49493bfd90
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          git worktree add -q --detach "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base" && apidiff -m -w "$RUNNER_TEMP/base.exp" github.com/Serraniel/neptide >/dev/null)
          out=$(apidiff -m -incompatible "$RUNNER_TEMP/base.exp" github.com/Serraniel/neptide | grep -v '^Ignoring internal package' || true)
          if [ -z "$out" ]; then
            echo "pkg/ is compatible with $base"
          elif echo "$TITLE" | grep -Eq '^[a-z]+(\([a-z0-9-]+\))?!: '; then
            printf '%s\n' "$out"
            echo "::warning::incompatible changes to pkg/ since $base, marked as breaking in the title"
          else
            printf '%s\n' "$out"
            echo "::error::incompatible changes to pkg/ since $base: keep them compatible, or mark the PR title as breaking (feat!: …)"
            exit 1
          fi

  conventional-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # release-please builds the changelog from squash-merged PR titles.
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|security|deps|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::PR title must follow Conventional Commits, e.g. 'feat(stacks): add rollback'"; exit 1; }
